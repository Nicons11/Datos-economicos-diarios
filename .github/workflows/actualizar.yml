name: Actualizar Excel en Google Drive
on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: excel-bna-drive
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
      - run: python -m pip install -r requirements-cloud.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pruebas sin Internet
        run: python -m unittest -v test_cloud test_bna.Rules.test_exact_previous_order_duplicates_and_ignore_extra test_bna.Rules.test_unavailable_invalid_blank_future_and_today test_bna.Rules.test_parse test_bna.Rules.test_source_validation
      - name: Consultar Errepar y actualizar Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python actualizar_drive.py
      - name: Guardar evidencia y respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-y-evidencia-${{ github.run_id }}
          path: |
            evidencia/
            respaldos/
          retention-days: 30
          if-no-files-found: ignore
