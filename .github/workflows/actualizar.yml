name: Actualizar Excel en Google Drive
on:
  schedule:
    # Argentina UTC-3: 19:05, respaldo 19:35 y respaldo 20:05.
    - cron: '5,35 22 * * *'
    - cron: '5 23 * * *'
  workflow_dispatch:
    inputs:
      comprobar_fuente:
        description: Comprobar fuentes económicas sin acceder a Google Drive
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: excel-bna-drive
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
      - run: python -m pip install -r requirements-cloud.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pruebas sin Internet
        run: python -m unittest -v test_economicos test_apps_script test_cloud test_bna.Rules.test_exact_previous_order_duplicates_and_ignore_extra test_bna.Rules.test_unavailable_invalid_blank_future_and_today test_bna.Rules.test_parse test_bna.Rules.test_source_validation
      - name: Consultar fuentes económicas y actualizar Drive
        if: ${{ !inputs.comprobar_fuente }}
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || '1o4O5rZIrIEjiwMHkRw1iYDTPHb2kBxmk' }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ]; then
            python actualizar_apps_script.py
          else
            python actualizar_drive.py
          fi
      - name: Comprobar fuentes reales sin Drive
        if: ${{ inputs.comprobar_fuente }}
        run: python actualizar_economicos.py
      - name: Guardar evidencia y respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-y-evidencia-${{ github.run_id }}
          path: |
            evidencia/
            respaldos/
          retention-days: 30
          if-no-files-found: ignore

