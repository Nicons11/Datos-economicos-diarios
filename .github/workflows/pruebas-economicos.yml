name: Probar nuevas fuentes económicas
on:
  push:
    branches: ['codex/nuevas-fuentes-economicas']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v test_financieros test_economicos test_apps_script test_cloud
      - name: Consultar fuentes reales en copia aislada sin Drive
        run: |
          cp Tipo_de_Cambio_BNA.xlsx prueba.xlsx
          python actualizar_economicos.py --book prueba.xlsx
          python -c 'from actualizar_economicos import check_result; check_result()'
      - name: Resumen verificable de la copia de prueba
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import load_workbook
          report=Path('evidencia/resultado.json')
          if report.exists():
            print('::notice title=Resultado de fuentes::'+report.read_text().replace('%','%25').replace('\n','%0A'))
          if Path('prueba.xlsx').exists():
            w=load_workbook('prueba.xlsx',data_only=True)
            summary=[]
            for s in w:
              rows=[list(r) for r in s.values if r[0] is not None]
              summary.append({'hoja':s.title,'filas':s.max_row,'ultimos':rows[-2:]})
            print('::notice title=Libro de prueba::'+json.dumps(summary,default=str,ensure_ascii=True).replace('%','%25'))
          PY
      - name: Guardar resultado y evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-economicos
          path: |
            prueba.xlsx
            evidencia/
          retention-days: 7
