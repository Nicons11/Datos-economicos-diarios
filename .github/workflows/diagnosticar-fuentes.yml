name: Diagnosticar fuentes financieras
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspeccionar respuestas públicas
        run: python investigar_fuentes.py
