name: Verificar Excel de Drive sin modificarlo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openpyxl
      - name: Verificar versión del puente y contenido vigente
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
        run: |
          python - <<'PY'
          import os,io,json,base64
          from datetime import date,datetime
          from openpyxl import load_workbook
          from actualizar_apps_script import exchange
          r=exchange(os.environ['APPS_SCRIPT_URL'],os.environ['APPS_SCRIPT_KEY'],'read')
          name=r.get('fileName')
          print('::notice title=Versión del puente::'+json.dumps({'fileName':name}))
          assert name in ('Datos Financieros.xlsx','Tipo_de_Cambio_BNA.xlsx'), 'La implementación publicada todavía no informa fileName: actualizar la versión de la implementación existente'
          w=load_workbook(io.BytesIO(base64.b64decode(r['content'],validate=True)),data_only=True)
          info=[]
          for s in w:
            rows=[list(row) for row in s.values if isinstance(row[0],(date,datetime))]
            info.append({'hoja':s.title,'observaciones':len(rows),'ultima':rows[-1] if rows else None})
          print('::notice title=Excel vigente verificado::'+json.dumps({'fileName':name,'hojas':info},default=str,ensure_ascii=True).replace('%','%25'))
          PY
